name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      # The released HA pytest fixture package currently declares the 2026.9
      # beta. Install its fixtures first, then requirements_test.txt pins
      # homeassistant to stable and the next step proves the resolver honored it.
      - name: Install test dependencies
        run: |
          pip install pytest-homeassistant-custom-component==0.13.362
          pip install -r requirements_test.txt
      - name: Verify runtime versions
        run: python -c "from importlib.metadata import version; import sys; assert version('homeassistant') == '2026.9.0'; assert sys.version_info[:2] == (3, 14)"
      - name: Run the suite
        run: pytest tests/ -v
      - name: Lint
        run: ruff check custom_components/ha_electric_usage_downloader tests
      - name: Type check
        run: mypy --python-version 3.14 custom_components/ha_electric_usage_downloader/
